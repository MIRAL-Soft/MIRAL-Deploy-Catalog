# Fetches the CatalogTool pinned in catalogtool.env, checks its SHA-256 on the downloaded bytes
# and proves that it runs and names the pinned version before anything trusts it (S-08, S-17,
# O-07). Shared by every workflow of this repository, so the steps exist once (C-01).

name: CatalogTool
description: Download and verify the pinned Linux CatalogTool.

outputs:
  path:
    description: Absolute path of the verified CatalogTool.
    value: ${{ steps.fetch.outputs.path }}

runs:
  using: composite
  steps:
    - id: fetch
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n 's/^CATALOGTOOL_VERSION=//p' catalogtool.env)"
        sha256="$(sed -n 's/^CATALOGTOOL_LINUX_SHA256=//p' catalogtool.env)"
        if [ -z "$version" ] || [ -z "$sha256" ]; then
          echo "::error::catalogtool.env pins no CatalogTool yet. The catalog checks cannot run, so this gate fails (R-23)."
          exit 1
        fi
        if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){2}$'; then
          echo "::error::CATALOGTOOL_VERSION '$version' is not a version like 1.2.3."
          exit 1
        fi
        if ! printf '%s' "$sha256" | grep -Eq '^[0-9a-f]{64}$'; then
          echo "::error::CATALOGTOOL_LINUX_SHA256 is not 64 lowercase hex digits."
          exit 1
        fi

        mkdir -p tools
        tool="$PWD/tools/catalogtool"
        url="https://deploy.miralsoft.com/catalogtool/$version/MiralDeploy.CatalogTool-linux-x64"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-redirs 0 \
          --max-filesize 200000000 --retry 3 --output "$tool" "$url"
        echo "$sha256  $tool" | sha256sum --check --strict -
        chmod +x "$tool"

        first="$("$tool" | head -n 1 || true)"
        if [ "$first" != "MIRAL Deploy CatalogTool $version" ]; then
          echo "::error::The CatalogTool names '$first', not version $version."
          exit 1
        fi
        echo "path=$tool" >> "$GITHUB_OUTPUT"
